Summary: On-device AI assistant with offline model, chat backup, image generation, code IDE and browser
Description: |
  Nexus AI is an original on-device AI assistant for Android 8.0+.

  Features:
  - Offline built-in N-gram language model — no internet or account needed.
  - Optional online mode with your own free-tier key (Groq / OpenRouter / Gemini / DeepSeek).
  - Interactive chat text: select, copy, save to file or share any reply.
  - Keyless image generation from a text prompt; save, share or open images.
  - Local website preview served on 127.0.0.1 from the Code IDE.
  - Code IDE connected to chat ("Ask Nexus" and "Open in IDE").
  - Swipe in from the right edge on any tab to open the Code IDE; left edge opens the menu.
  - Clean code editor (view/edit code like Google AI Studio, with Copy / Preview / Ask Nexus).
  - Google AI Studio-inspired dark UI and Kimi-style gradient pill buttons.
  - Swipe sensitivity and behavior unified across all tabs to match the chat screen.
  - Chat backup to shared storage that survives uninstall/reinstall.
  - Share chats, files and images to any app (WhatsApp, Gmail, Drive...).
  - Terminal and Code IDE tabs.
  - Real WebView browser tab with "Open in browser" and "Share link".
  - Works on low-RAM phones (under 8 GB RAM uses online mode automatically).

  No API keys are bundled. No telemetry, analytics or ads.
